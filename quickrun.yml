# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: HaVeWa
description: "Property management for rentals and HOAs. Postgres in Docker, the schema, the demo landlord, then the Next.js dev server."
docs: https://fgilde.github.io/hausverwaltung/docs/

requires:
  # Next 16 declares engines.node >=20.9.0, and below that it fails inside the bundler
  # rather than with a version message.
  - tool: node
    version: ">=20.9"
    install: https://nodejs.org
  - tool: docker
    install: https://docs.docker.com/get-docker/

env:
  # The credentials docker-compose.yml creates, which is what .env.example assumes as well.
  # Everything reads process.env, so no .env file is needed.
  DATABASE_URL: "postgresql://havewa:havewa@localhost:5432/havewa?schema=public"
  AUTH_SECRET: "quickrun-local-dev-secret"
  AUTH_TRUST_HOST: "true"
  # Read by prisma/bootstrap.ts below: it fills an empty system with the demo landlord and its
  # three logins (admin@havewa.app / admin, and the tenant and owner portals). Without it the
  # database comes up empty and the first visit is the setup wizard rather than the application.
  SEED_DEMO: "true"

inputs:
  # bootstrap.ts fills an empty database and does nothing once users exist. That is right until a
  # run leaves a half-finished database behind - a user, no tenant - because `docker compose down`
  # keeps the volume. The application then starts and every admin page fails on
  # `prisma.tenant.findUnique()` with an undefined id, and restarting cannot help: bootstrap sees
  # the user and skips. This is the way out. The value is the flag that does it, so the run needs
  # no shell branching on any platform.
  - id: database
    label: Database
    type: select
    default: --remove-orphans
    description: >-
      Start over deletes this project's havewa-db volume and sets up the schema, the landlord and
      the demo logins again. Needed when the application comes up complaining about a missing
      tenant - and it deletes the data of every earlier run.
    options:
      - value: --remove-orphans
        label: Keep the existing data
      - value: -v --remove-orphans
        label: Start over - deletes this project's local database

setup:
  # Whatever an earlier run left running, and the reset if it was asked for. continueOnError,
  # because there is nothing to bring down the first time.
  - run: docker compose down ${inputs.database}
    continueOnError: true
  - run: npm ci

tasks:
  - name: db
    # Waiting for Postgres, not for the socket: Docker answers on the published port before a fresh
    # volume has finished initialising, and the migration would run too early.
    run: docker compose up -d db && docker compose exec -T db sh -c "until pg_isready -U havewa -d havewa; do sleep 1; done"
    readyWhen: {port: 5432}

  - name: web
    # The same sequence the Dockerfile runs - migrate, bootstrap, start - with the dev server at
    # the end. bootstrap.ts is invoked from the Dockerfile and nowhere else, never by `npm run dev`,
    # and it is what turns a migrated but empty database into a usable one. It is idempotent and
    # does nothing once users exist.
    #
    # --port 3000 is not decoration. Without it Next picks the next free port when 3000 is taken -
    # by, typically, a next-server left behind by an earlier run - and then two Turbopack dev
    # servers share this project directory, which ends in "Another next dev server is already
    # running". Meanwhile readyWhen below was answered by the stale server, so the run looked
    # healthy while Turbopack was erroring. Pinned, the port either binds or fails with EADDRINUSE.
    run: npx prisma generate && npx prisma migrate deploy && npx tsx prisma/bootstrap.ts && npm run dev -- --port 3000
    dependsOn: [db]
    readyWhen: {http: "http://localhost:3000"}
    open: true

stop:
  - docker compose down
